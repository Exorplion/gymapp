/* ---------- análisis de fuerza (Sección 21) ----------
   1RM estimado con Epley. La fórmula se desvía con series largas, así que las
   de más de 12 reps no entran en la tendencia. */
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);
/* mejor 1RM estimado por sesión, en orden cronológico (S.sessions viene al revés) */
function e1rmSeries(name){
  const key=norm(name),out=[];
  [...S.sessions].reverse().forEach(s=>{
    let best=0;
    (s.entries||[]).forEach(e=>{
      if(norm(e.name)!==key)return;
      e.sets.forEach(st=>{ if(st.r<=12){const v=e1rm(st.w,st.r); if(v>best)best=v;} });
    });
    if(best>0)out.push({date:s.date,y:best});
  });
  return out;
}
/* regresión lineal de kg contra días. Devuelve también R²: sin él no se puede
   distinguir una progresión real de una nube de puntos con ruido. */
function trend(pts){
  if(pts.length<4)return null;
  const t0=new Date(pts[0].date+'T12:00:00').getTime();
  const xs=pts.map(p=>(new Date(p.date+'T12:00:00').getTime()-t0)/86400000),ys=pts.map(p=>p.y);
  const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;
  for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2;}
  if(!den)return null;
  const slope=num/den,intercept=my-slope*mx;
  const ss=ys.reduce((a,y)=>a+(y-my)**2,0);
  let res=0;
  for(let i=0;i<n;i++)res+=(ys[i]-(intercept+slope*xs[i]))**2;
  return {slope,r2:ss?1-res/ss:0,n,last:ys[n-1],days:xs[n-1]};
}
/* categoría muscular del ejercicio, reutilizando el catálogo del selector */
function catOf(name){
  const n=norm(name);let best=null,len=0;
  for(const e of EXCATALOG){const ne=norm(e.n);if(n.includes(ne)&&ne.length>len){best=e.c;len=ne.length;}}
  return best;
}
function muscleVolume(days){
  const cutoff=dstr(new Date(Date.now()-days*86400000)),tally={};
  S.sessions.filter(s=>s.date>=cutoff).forEach(s=>(s.entries||[]).forEach(e=>{
    const c=catOf(e.name);if(c)tally[c]=(tally[c]||0)+e.sets.length;
  }));
  return tally;
}
/* Proyección deliberadamente conservadora. Extrapolar la pendiente medida en
   línea recta da números de fantasía: 5 sesiones de novato dan +3 kg/semana, que
   a 4 semanas proyecta +13 kg. Ese ritmo no se sostiene. Se limita a 1 %/semana
   del 1RM actual (techo realista sostenido) y se exige una tendencia con señal
   (R² ≥ .5) sobre al menos 4 sesiones. */
function project(t,weeks){
  if(!t||t.n<4||t.r2<0.5||t.slope<=0)return null;
  const cap=t.last*0.01,measured=t.slope*7,perWeek=Math.min(measured,cap);
  return {perWeek,measured,value:t.last+perWeek*weeks,capped:measured>cap};
}
/* una línea honesta por ejercicio: subiendo / plano / bajando, y a qué ritmo */
function strengthReadout(){
  const names=[...new Set(S.sessions.flatMap(s=>(s.entries||[]).map(e=>e.name.trim())))];
  return names.map(n=>{
    const pts=e1rmSeries(n),t=trend(pts);
    return {name:n,pts,t,last:pts.length?pts[pts.length-1].y:0};
  }).filter(x=>x.pts.length>=2).sort((a,b)=>b.last-a.last);
}

const CHART_SEL=new WeakMap();
function drawChart(cv,pts,opts={}){
  const dpr=devicePixelRatio||1;
  const W=cv.clientWidth||300,H=cv.clientHeight||200;
  cv.width=W*dpr;cv.height=H*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);
  x.clearRect(0,0,W,H);
  if(pts.length<2){
    x.fillStyle='#5C6885';x.font='500 14px Barlow, sans-serif';x.textAlign='center';
    x.fillText(pts.length?'Registra al menos 2 puntos para ver la curva':'Sin datos todavía',W/2,H/2);
    cv._pts=null;
    return;
  }
  const P={l:46,r:16,t:24,b:26};
  const ys=pts.map(p=>p.y);
  let mn=Math.min(...ys),mx=Math.max(...ys);
  if(mn===mx){mn-=1;mx+=1;}
  const padY=(mx-mn)*.14;mn-=padY;mx+=padY;
  const t0=+new Date(pts[0].date+'T00:00:00'),t1=+new Date(pts[pts.length-1].date+'T00:00:00');
  const span=t1-t0||1;
  const X=d=>P.l+(W-P.l-P.r)*((+new Date(d+'T00:00:00'))-t0)/span;
  const Y=v=>P.t+(H-P.t-P.b)*(1-(v-mn)/(mx-mn));
  if(opts.unit){x.font='600 10px Barlow, sans-serif';x.fillStyle='#8B97B4';x.textAlign='left';x.fillText(opts.unit,2,12);}
  x.font='500 11px Barlow, sans-serif';
  x.strokeStyle='rgba(120,150,220,.13)';x.lineWidth=1;
  for(let i=0;i<=3;i++){
    const v=mn+(mx-mn)*i/3,y=Y(v);
    x.beginPath();x.moveTo(P.l,y);x.lineTo(W-P.r,y);x.stroke();
    x.fillStyle='#6B7A99';x.textAlign='right';x.fillText(fmtNum(round1(v)),P.l-8,y+4);
  }
  x.textAlign='center';x.fillStyle='#6B7A99';
  x.fillText(fmtD(pts[0].date),Math.max(P.l+16,X(pts[0].date)),H-8);
  x.fillText(fmtD(pts[pts.length-1].date),Math.min(W-P.r-16,X(pts[pts.length-1].date)),H-8);
  const g=x.createLinearGradient(0,P.t,0,H-P.b);
  g.addColorStop(0,'rgba(62,150,255,.32)');g.addColorStop(1,'rgba(62,150,255,0)');
  x.beginPath();
  pts.forEach((p,i)=>{const px=X(p.date);i?x.lineTo(px,Y(p.y)):x.moveTo(px,Y(p.y));});
  x.lineTo(X(pts[pts.length-1].date),H-P.b);x.lineTo(X(pts[0].date),H-P.b);x.closePath();
  x.fillStyle=g;x.fill();
  x.beginPath();
  pts.forEach((p,i)=>{const px=X(p.date);i?x.lineTo(px,Y(p.y)):x.moveTo(px,Y(p.y));});
  x.strokeStyle='#3E96FF';x.lineWidth=2.5;x.lineJoin='round';x.lineCap='round';
  x.shadowColor='rgba(62,150,255,.5)';x.shadowBlur=8;
  x.stroke();x.shadowBlur=0;
  const selIdx=Math.min(CHART_SEL.get(cv)??pts.length-1,pts.length-1);
  pts.forEach((p,i)=>{
    const sel=i===selIdx,px=X(p.date);
    x.beginPath();x.arc(px,Y(p.y),sel?4.5:3,0,7);
    x.fillStyle=sel?'#8FC2FF':'#3E96FF';x.fill();
  });
  const sp=pts[selIdx],spx=X(sp.date);
  x.strokeStyle='rgba(143,194,255,.4)';x.lineWidth=5;
  x.beginPath();x.arc(spx,Y(sp.y),8,0,7);x.stroke();
  const valTxt=`${fmtNum(sp.y)}${opts.unit?' '+opts.unit:''}${sp.r?' × '+sp.r:''}`;
  x.fillStyle='#EAF0FC';x.font='700 13px "Barlow Condensed", sans-serif';x.textAlign='center';
  x.fillText(`${fmtD(sp.date)} · ${valTxt}`,spx,Math.max(14,Y(sp.y)-14));
  cv._pts=pts;cv._X=X;
}
function pickChartPoint(cv,clientX){
  const pts=cv._pts,X=cv._X;if(!pts||!X)return;
  const rect=cv.getBoundingClientRect();
  const px=clientX-rect.left;
  let best=0,bd=Infinity;
  pts.forEach((p,i)=>{const d=Math.abs(X(p.date)-px);if(d<bd){bd=d;best=i;}});
  CHART_SEL.set(cv,best);
}
addEventListener('click',e=>{
  const cv=e.target.closest?.('canvas.chart');
  if(!cv||!cv._pts)return;
  pickChartPoint(cv,e.clientX);
  drawChart(cv,cv._pts,cv._opts||{});
});

function genBodyForWindow(){
  const anchors=SEED_BODY.map(([date,weight,waist,arm])=>({t:+new Date(date+'T00:00:00'),weight,waist,arm}));
  const out=[...SEED_BODY];
  const start=anchors[0].t,end=anchors[anchors.length-1].t;
  for(let t=start;t<=end;t+=2*86400000){
    if(anchors.some(a=>Math.abs(a.t-t)<86400000))continue;
    let lo=anchors[0],hi=anchors[anchors.length-1];
    for(let i=0;i<anchors.length-1;i++)if(anchors[i].t<=t&&t<=anchors[i+1].t){lo=anchors[i];hi=anchors[i+1];break;}
    const frac=hi.t===lo.t?0:(t-lo.t)/(hi.t-lo.t);
    const base=lo.weight+(hi.weight-lo.weight)*frac;
    const noise=(Math.random()-0.5)*0.8;
    out.push([dstr(new Date(t)),Math.round((base+noise)*10)/10]);
  }
  return out.sort((a,b)=>a[0]<b[0]?-1:1);
}

function seedSessions(){
  const out=[];
  const today=new Date();today.setHours(0,0,0,0);
  Object.keys(SEED_SPLIT).forEach(k=>{
    const wd=+k,[dayName,list]=SEED_SPLIT[wd];
    const exs=S.routine[wd].exercises;
    const iRef=SEED_WEEKS-1-SEED_REF;
    for(let i=0;i<SEED_WEEKS;i++){
      /* día salteado de tanto en tanto (ocupado/enfermo) — nunca la semana más reciente */
      if(i<SEED_WEEKS-1&&Math.random()<0.15)continue;
      const back=(SEED_WEEKS-1-i)*7+((today.getDay()-wd+7)%7);
      const d=new Date(today);d.setDate(today.getDate()-back);
      if(d>today)continue;
      const cyc=i%3, reps=[6,7,9][cyc];
      /* 20% de las semanas queda "en meseta": un escalón atrás del progreso esperado */
      const stepBase=Math.floor(i/3)-Math.floor(iRef/3);
      const step=Math.random()<0.2?Math.max(0,stepBase-1):stepBase;
      const entries=exs.map((ex,n)=>{
        const [,,,wRec,inc]=list[n];
        const noise=(Math.random()-0.5)*(inc/2);
        const w=Math.max(inc,Math.round((wRec+step*inc+noise)/(inc/2))*(inc/2));
        const sets=[];
        for(let sN=0;sN<ex.sets;sN++)sets.push({w,r:sN?Math.max(5,reps-1):reps,t:d.getTime()});
        return {exId:ex.id,name:ex.name,sets};
      });
      const nsets=entries.reduce((a,e)=>a+e.sets.length,0);
      const dur=Math.round(nsets*2.9+8);
      const start=new Date(d);start.setHours(6,0,0,0);
      out.push({id:uid(),date:dstr(d),weekday:wd,dayName,seed:true,
        start:start.getTime(),end:start.getTime()+dur*60000,duration:dur,entries});
    }
  });
  return out.sort((a,b)=>b.start-a.start);
}

  for(let d=new Date(windowStart);d<=new Date();d.setDate(d.getDate()+1)){
    const ds=dstr(d);
    if(SEED_MEALS[ds]||S.meals.some(m=>m.date===ds&&!m.seed))continue;
    for(const [name,kcal,p,c,f,t] of genMealsForDay(ds,S.cfg.goals)){
      const m={id:uid(),date:ds,name,kcal,p,c,f,t,seed:true};
      await idb.put('meals',m);S.meals.push(m);
    }
  }

  for(const [date,weight,waist,arm] of genBodyForWindow()){
    const b={id:uid(),date,weight,waist:waist??null,arm:arm??null,chest:null,leg:null,seed:true};
    await idb.put('body',b);S.body.push(b);
  }
  S.body.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  S.cfg.profile.weightKg=74;
  S.cfg.rest=180;                  // 3 min, el descanso de compuestos
  S.cfg.routineName='Anterior / Posterior';
  await saveCfg();
  /* queda también en la biblioteca, para poder volver a ella tras probar otra */
  S.lib=S.lib.filter(r=>r.name!=='Anterior / Posterior');
  S.lib.unshift({id:uid(),name:'Anterior / Posterior',days:routineSnapshot(),savedAt:dstr()});
  await saveLib();
}

/* ================= reordenar (Hoy y Rutina) ================= */
/* Cualquier contenedor con [data-sort] cuyos hijos tengan [data-sid] se puede
   reordenar arrastrando. Todo se calcula en coordenadas de documento, no de
   viewport: si no, en cuanto la página se desplaza el arrastre se descuadra. */

/* FLIP: mido dónde está cada fila, dejo que el render la mueva, y la devuelvo a
   su sitio viejo con un transform para animarla hasta el nuevo. Sin esto el
   reordenado por flechas sería un salto seco. */
function flipSort(mutate){
  const first=new Map();
  $$('[data-sort] > [data-sid]').forEach(k=>first.set(k.dataset.sid,k.getBoundingClientRect().top));
  keepScroll(mutate);
  if(!first.size)return;
  $$('[data-sort] > [data-sid]').forEach(k=>{
    const f=first.get(k.dataset.sid);
    if(f==null)return;
    const d=f-k.getBoundingClientRect().top;
    if(!d)return;
    k.style.transition='none';
    k.style.transform=`translateY(${d}px)`;
    requestAnimationFrame(()=>{
      k.style.transition='transform .34s var(--ease)';
      k.style.transform='';
      setTimeout(()=>{k.style.transition='';k.style.transform='';},380);
    });
  });
}

const DRAG={on:false,box:null,el:null,cards:[],rects:[],gap:12,from:-1,to:-1,y0:0,self:0,cy:0,raf:0,swallow:false};
const LP={t:null,card:null,x:0,y:0};

function dragPick(e){
  const t=e.target;
  if(!t||!t.closest)return null;
  if(t.closest('button,input,select,textarea,.chip,#sheet,#restbar'))return null;
  const card=t.closest('[data-sid]');
  if(!card)return null;
  const box=card.parentElement;
  if(!box||!box.hasAttribute('data-sort'))return null;
  if([...box.children].filter(k=>k.dataset.sid).length<2)return null;
  return card;
}
function dragStart(card,clientY){
  const box=card.parentElement;
  const cards=[...box.children].filter(k=>k.dataset.sid);
  const from=cards.indexOf(card);
  if(from<0)return;
  const rects=cards.map(k=>{const r=k.getBoundingClientRect();return{top:r.top+scrollY,h:r.height};});
  const gap=Math.max(0,rects[1].top-(rects[0].top+rects[0].h));
  Object.assign(DRAG,{on:true,box,el:card,cards,rects,gap,from,to:from,y0:clientY+scrollY,self:0,cy:clientY});
  document.body.classList.add('dragging-on');
  card.classList.remove('shift','settling');
  card.classList.add('dragging');
  cards.forEach((k,i)=>{if(i!==from)k.classList.add('shift');});
  vibrate(18);
  DRAG.raf=requestAnimationFrame(dragTick);
}
/* la ventana sigue al dedo: cerca de los bordes se desplaza sola, más rápido
   cuanto más al borde estés, para poder llevar un ejercicio al otro extremo */
const DRAG_EDGE=120,DRAG_SPEED=18;
function dragTick(){
  if(!DRAG.on)return;
  const h=innerHeight;
  let v=0;
  if(DRAG.cy<DRAG_EDGE)v=-DRAG_SPEED*(1-DRAG.cy/DRAG_EDGE);
  else if(DRAG.cy>h-DRAG_EDGE)v=DRAG_SPEED*(1-(h-DRAG.cy)/DRAG_EDGE);
  if(v){
    const max=Math.max(0,document.documentElement.scrollHeight-h);
    const y=Math.max(0,Math.min(max,scrollY+v));
    if(y!==scrollY){scrollTo({top:y,behavior:'instant'});dragUpdate();}
  }
  DRAG.raf=requestAnimationFrame(dragTick);
}
function dragMove(clientY){
  if(!DRAG.on)return;
  DRAG.cy=clientY;
  dragUpdate();
}
function dragUpdate(){
  const dy=(DRAG.cy+scrollY)-DRAG.y0;
  DRAG.el.style.transform=`translateY(${dy}px) scale(var(--lift,1.03))`;
  const mid=DRAG.rects[DRAG.from].top+DRAG.rects[DRAG.from].h/2+dy;
  let to=0;
  DRAG.rects.forEach((r,i)=>{if(i!==DRAG.from&&mid>r.top+r.h/2)to++;});
  if(to!==DRAG.to){DRAG.to=to;dragLayout();vibrate(6);}
}
/* recalcula el apilado real (las filas no miden todas lo mismo) y corre cada
   una a su nueva posición */
function dragLayout(){
  const {rects,gap,from,to,cards}=DRAG;
  const idx=rects.map((_,i)=>i);
  const [m]=idx.splice(from,1);idx.splice(to,0,m);
  let y=rects[0].top;
  const shift=new Array(rects.length);
  idx.forEach(i=>{shift[i]=y-rects[i].top;y+=rects[i].h+gap;});
  DRAG.self=shift[from];
  cards.forEach((k,i)=>{if(i!==from)k.style.transform=shift[i]?`translateY(${shift[i]}px)`:'';});
}
function dragEnd(commit){
  if(!DRAG.on)return;
  DRAG.on=false;
  cancelAnimationFrame(DRAG.raf);
  const {cards,el,from,to,self,box}=DRAG;
  document.body.classList.remove('dragging-on');
  DRAG.swallow=true;setTimeout(()=>{DRAG.swallow=false;},400);
  const moved=commit&&to!==from;
  el.classList.remove('dragging');
  el.classList.add('settling');
  el.style.transform=moved?`translateY(${self}px)`:'';
  const clean=()=>cards.forEach(k=>{k.style.transform='';k.classList.remove('shift','settling');});
  if(!moved){setTimeout(clean,300);return;}
  const ids=cards.map(k=>k.dataset.sid);
  const [m]=ids.splice(from,1);ids.splice(to,0,m);
  vibrate(22);
  const kind=box.dataset.sort,wd=box.dataset.wd;
  if(kind==='days'){
    pushHistory('Días intercambiados');
    setTimeout(async()=>{ await swapDayContents(ids); clean(); renderRutina(); },300);
    return;
  }
  /* guardo ya, en paralelo con la animación de aterrizaje */
  const saved=commitSort(kind,wd,ids);
  setTimeout(async()=>{
    /* en vez de re-dibujar la vista entera (eso es lo que hacía parpadear y te
       perdía de lugar), muevo los nodos en el DOM al orden nuevo y borro los
       transforms en la misma tarea: en pantalla no cambia un pixel */
    const by=new Map(cards.map(k=>[k.dataset.sid,k]));
    ids.forEach(id=>{const k=by.get(id);if(k)box.appendChild(k);});
    clean();
    refreshSortArrows(box);
    await saved;
    /* Hoy sí necesita recalcular cuál es el próximo ejercicio; lo hace sobre un
       DOM que ya está en el orden final, así que no se mueve nada */
    if(kind==='hoy'&&S.draft)keepScroll(renderHoy);
  },300);
}
/* deshabilita ↑ en el primero y ↓ en el último sin volver a dibujar */
function refreshSortArrows(box){
  const ks=[...box.children].filter(k=>k.dataset.sid);
  ks.forEach((k,i)=>{
    const up=k.querySelector('[data-d="-1"],[data-act="ex-up"]');
    const dn=k.querySelector('[data-d="1"],[data-act="ex-down"]');
    if(up)up.disabled=i===0;
    if(dn)dn.disabled=i===ks.length-1;
  });
}
function keepScroll(fn){
  const y=scrollY;
  fn();
  if(Math.abs(scrollY-y)>1)scrollTo({top:y,behavior:'instant'});
}
async function commitSort(kind,wd,ids){
  if(kind==='hoy')return setExOrder(currentDayForHoy(),ids);
  const d=S.routine[+wd];
  if(!d||!d.exercises)return;
  pushHistory('Ejercicios reordenados');
  const by=new Map(d.exercises.map(e=>[e.id,e]));
  const out=[];
  ids.forEach(i=>{if(by.has(i)){out.push(by.get(i));by.delete(i);}});
  by.forEach(e=>out.push(e));   // nada se pierde si la lista quedó desfasada
  d.exercises=out;
  return persistDay(+wd);
}

addEventListener('touchstart',e=>{
  if(e.touches.length!==1)return;
  const card=dragPick(e);if(!card)return;
  LP.card=card;LP.x=e.touches[0].clientX;LP.y=e.touches[0].clientY;
  clearTimeout(LP.t);
  LP.t=setTimeout(()=>{if(LP.card)dragStart(LP.card,LP.y);},330);
},{passive:true});
addEventListener('touchmove',e=>{
  if(DRAG.on){e.preventDefault();dragMove(e.touches[0].clientY);return;}
  if(!LP.card)return;
  const t=e.touches[0];
  /* si el dedo se movió antes de los 330 ms era scroll, no un arrastre */
  if(Math.abs(t.clientY-LP.y)>10||Math.abs(t.clientX-LP.x)>10){clearTimeout(LP.t);LP.card=null;}
},{passive:false});
addEventListener('touchend',()=>{clearTimeout(LP.t);LP.card=null;if(DRAG.on)dragEnd(true);},{passive:true});
addEventListener('touchcancel',()=>{clearTimeout(LP.t);LP.card=null;if(DRAG.on)dragEnd(false);},{passive:true});

addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  const card=dragPick(e);if(!card)return;
  LP.card=card;LP.x=e.clientX;LP.y=e.clientY;
  clearTimeout(LP.t);
  LP.t=setTimeout(()=>{if(LP.card)dragStart(LP.card,LP.y);},300);
});
addEventListener('mousemove',e=>{
  if(DRAG.on){e.preventDefault();dragMove(e.clientY);return;}
  if(!LP.card)return;
  if(Math.abs(e.clientY-LP.y)>8||Math.abs(e.clientX-LP.x)>8){clearTimeout(LP.t);LP.card=null;}
});
addEventListener('mouseup',()=>{clearTimeout(LP.t);LP.card=null;if(DRAG.on)dragEnd(true);});
/* el click que cierra un arrastre no debe disparar nada */
addEventListener('click',e=>{if(DRAG.swallow){e.preventDefault();e.stopPropagation();}},true);

/* ================= acciones (delegación global) ================= */
const ACT={
  'tab':b=>switchTab(b.dataset.tab),
  'goto-rutina':()=>switchTab('rutina'),
  'streak-open':()=>sheetStreak(),
  'settings':()=>sheetSettings(),
  'sheet-close':()=>{PENDING_CONFIRM=null;PENDING_CANCEL=null;closeSheet();},
  'confirm-yes':()=>{const fn=PENDING_CONFIRM;PENDING_CONFIRM=null;PENDING_CANCEL=null;closeSheet();fn&&fn();},
  'confirm-no':()=>{const fn=PENDING_CANCEL;PENDING_CONFIRM=null;PENDING_CANCEL=null;if(fn)fn();else closeSheet();},
  /* hoy */
  'hoy-day':b=>{S.hoyDay=+b.dataset.wd;renderHoy();},
  'w-':b=>{const v=S.hoyVals[b.dataset.ex];v.w=Math.max(0,round1(v.w-wStep()));updExDisplays(b.dataset.ex);},
  'w+':b=>{const v=S.hoyVals[b.dataset.ex];v.w=round1(v.w+wStep());updExDisplays(b.dataset.ex);},
  'r-':b=>{const v=S.hoyVals[b.dataset.ex];v.r=Math.max(1,v.r-1);updExDisplays(b.dataset.ex);},
  'r+':b=>{const v=S.hoyVals[b.dataset.ex];v.r++;updExDisplays(b.dataset.ex);},
  'set-save':b=>saveSet(b.dataset.ex),
  'set-del':async b=>{
    const exId=b.dataset.ex,e=S.draft?.entries[exId];if(!e)return;
    e.sets.splice(+b.dataset.i,1);
    if(!e.sets.length)delete S.draft.entries[exId];
    /* si le borrás una serie a un ejercicio cerrado, vuelve a quedar abierto */
    if(S.draft&&!S.draft.cur)S.draft.cur=exId;
    if(S.draft&&!Object.keys(S.draft.entries).length&&!S.draft.start)S.draft.cur=null;
    await saveDraft();render(true);
  },
  'ex-start':async b=>{
    if(!S.draft){toast('Primero iniciá el entrenamiento');return;}
    const ex=findEx(b.dataset.ex);if(!ex)return;
    S.draft.cur=ex.id;
    /* el cronómetro arranca acá: ya estás en la máquina */
    const first=!S.draft.start;
    if(first)S.draft.start=Date.now();
    await saveDraft();vibrate(15);renderHoy();
    const card=$('#exc-'+ex.id);
    if(card)setTimeout(()=>card.scrollIntoView({block:'center',behavior:'smooth'}),60);
    toast(first?`⏱ Cronómetro en marcha · ${ex.name}`:`${ex.name} · serie 1 de ${ex.sets}`);
  },
  'ex-move':async b=>{
    const wd=currentDayForHoy();
    const list=orderedExs(wd,S.routine[wd]?.exercises||[]);
    const i=list.findIndex(e=>e.id===b.dataset.ex),j=i+(+b.dataset.d);
    if(i<0||j<0||j>=list.length)return;
    const ids=list.map(e=>e.id);
    [ids[i],ids[j]]=[ids[j],ids[i]];
    await setExOrder(wd,ids);
    vibrate(8);
    flipSort(()=>renderHoy());
  },
  'sess-start':()=>{
    const wd=currentDayForHoy(),day=S.routine[wd];
    if(!day?.exercises?.length){toast('Este día no tiene ejercicios');return;}
    openSheet(`<h2>Iniciar entrenamiento</h2>
      <div class="txt-mut" style="font-size:14px;line-height:1.55;margin:-8px 0 16px">Vas a abrir la sesión de <b class="txt-blue">${esc(day.name||WD[wd])}</b> · ${day.exercises.length} ejercicio${day.exercises.length===1?'':'s'}.</div>
      <div class="calcbox">
        <div style="font-size:14px;line-height:1.55">⏱ <b>El cronómetro arranca cuando toques "Iniciar ejercicio"</b>, no ahora. Así el tiempo mide lo que entrenaste y no lo que tardaste en cambiarte, calentar y llegar a la máquina.</div>
      </div>
      <div class="calcbox" style="margin-top:10px">
        <div style="font-size:14px;line-height:1.55">↕ Antes de arrancar podés <b>reacomodar el orden</b> con las flechas, por si la máquina está ocupada.</div>
      </div>
      <div class="calcbox" style="margin-top:10px">
        <div style="font-size:14px;line-height:1.55">✓ Vas de a un ejercicio: al llegar a las series objetivo se cierra solo y pasás al siguiente.</div>
      </div>
      <button class="btn" data-act="sess-start-go" data-wd="${wd}" style="margin-top:16px">Abrir sesión</button>
      <button class="btn dim" data-act="sheet-close" style="margin-top:10px">Cancelar</button>`);
  },
  'sess-start-go':async b=>{
    const wd=+b.dataset.wd,day=S.routine[wd];
    if(!day?.exercises?.length){toast('Este día no tiene ejercicios');return;}
    /* open = cuándo abriste la sesión · start = cuándo hiciste la primera serie.
       El reloj usa start, que es lo que de verdad cuenta como entrenar. */
    S.draft={id:uid(),date:dstr(),weekday:wd,dayName:day.name||WD[wd],open:Date.now(),start:null,cur:null,
      order:orderedExs(wd,day.exercises).map(e=>e.id),entries:{}};
    await saveDraft();
    closeSheet();vibrate(15);renderHoy();
    toast('Sesión abierta · tocá "Iniciar ejercicio" cuando estés en la máquina');
  },
  'sess-done':()=>{if(confirm('¿Completar y guardar la sesión?'))completeSession();},
  'recap-close':()=>closeSheet(),
  'sess-discard':async()=>{if(!confirm('¿Descartar la sesión en curso?'))return;S.draft=null;S.hoyDay=null;await saveDraft();stopRest();renderHoy();},
  'seed-load':async()=>{
    if(seedCount()&&!confirm('Ya hay datos cargados. ¿Cargarlos otra vez? Se van a duplicar.'))return;
    const mine=S.sessions.filter(s=>!s.seed).length;
    if(!confirm(`Esto reemplaza tu split por la rutina Anterior/Posterior y agrega ~5 semanas de sesiones, ~1 mes de nutrición y tus pesadas.${mine?`\n\nTus ${mine} sesiones propias no se tocan.`:''}\n\nOjo: el historial de sesiones está reconstruido desde tus pesos anotados, no es un registro real.\n\n¿Continuar?`))return;
    toast('Cargando…');
    await seedRegistro();
    vibrate([30,50,30]);
    setTimeout(()=>location.reload(),400);
  },
  'seed-wipe':async()=>{
    if(!confirm(`¿Borrar los ${seedCount()} registros cargados? Lo que hayas anotado vos queda.`))return;
    await wipeSeed();
    setTimeout(()=>location.reload(),300);
  },
  'hist-view':b=>sheetHist(b.dataset.id),
  'hist-del':async b=>{
    if(!confirm('¿Eliminar esta sesión del historial?'))return;
    await idb.del('sessions',b.dataset.id);
    S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);
    closeSheet();render(true);
  },
  /* rest */
  'rest-add':()=>{T.end+=30000;tickRest();},
  'rest-skip':()=>stopRest(),
  'rest-min':()=>minimizeRest(),
  'rest-expand':()=>expandRest(),
  'rest-cfg':b=>{S.cfg.rest=Math.max(0,(S.cfg.rest||0)+ +b.dataset.d);saveCfg();$('#f-rest').value=S.cfg.rest?fmtMMSS(S.cfg.rest):'OFF';},
  /* progreso */
  'prog-range':b=>{S.progRange=b.dataset.r;renderProg();},
  'prog-tab':b=>{S.progTab=b.dataset.t;renderProg();},
  /* rutina */
  'tmpl-open':()=>sheetLibrary(),
  'tmpl-apply':b=>applyTemplate(b.dataset.id),
  'tmpl-clear':()=>{
    if(!Object.values(S.routine).some(d=>d.exercises?.length)){
      S.rutMode='edit';closeSheet();renderRutina();return;
    }
    sheetConfirm('¿Vaciar tu split?','Se borran todos los días y ejercicios.','Vaciar',async()=>{
      await idb.clear('routine');S.routine={};
      S.cfg.routineName='';await saveCfg();
      S.rutMode='edit';closeSheet();renderRutina();toast('Split vacío — armá el tuyo');
    });
  },
  'ex-info':b=>{const d=S.routine[+b.dataset.wd];const ex=d?.exercises.find(e=>e.id===b.dataset.ex);if(ex)sheetExInfo(ex.name,+b.dataset.wd,ex.id);},
  'day-toggle':b=>{
    const wd=+b.dataset.wd;
    S.rutOpen=S.rutOpen===wd?null:wd;
    /* se alterna la clase en lugar de re-renderizar: una transición CSS solo
       corre si el nodo sobrevive al cambio de estado */
    $$('#view-rutina .card.day').forEach(c=>c.classList.toggle('open',+c.dataset.wd===S.rutOpen));
  },
  'day-edit':b=>{
    const wd=+b.dataset.wd,d=S.routine[wd];
    openSheet(`<h2>${WD[wd]}</h2>
      <div class="field"><label>Nombre del día (grupos musculares)</label>
      <input id="f-dayname" value="${d?.name?esc(d.name):''}" placeholder="Pecho / Tríceps"></div>
      <button class="btn" data-act="day-save" data-wd="${wd}">Guardar</button>`);
    setTimeout(()=>$('#f-dayname')?.focus(),80);
  },
  'day-save':async b=>{
    const wd=+b.dataset.wd,d=ensureDay(wd);
    d.name=$('#f-dayname').value.trim();
    await persistDay(wd);closeSheet();renderRutina();
  },
  'day-del':async b=>{
    const wd=+b.dataset.wd,d=S.routine[wd];
    if(!d?.name&&!d?.exercises?.length)return;
    pushHistory('Día vaciado');
    S.routine[wd]={weekday:wd,name:'',exercises:[]};
    await persistDay(wd);
    renderRutina();
  },
  'ex-add':b=>sheetExForm(+b.dataset.wd,null),
  'ex-pick':b=>{
    const inp=$('#f-exname');if(inp){inp.value=b.dataset.name;inp.focus();}
    const box=$('#ex-autocomplete');if(box)box.innerHTML='';
  },
  'exf-step':b=>{
    const inp=$('#f-'+b.dataset.f);if(!inp)return;
    inp.value=Math.max(1,(parseInt(inp.value)||0)+ +b.dataset.d);
  },
  'ex-voice':b=>{
    if(!SR_CLASS)return;
    if(VOICE){VOICE.stop();return;} // toca de nuevo para cancelar
    const rec=new SR_CLASS();
    rec.lang='es-ES';rec.interimResults=false;rec.maxAlternatives=1;
    VOICE=rec;b.classList.add('accent');b.textContent='🔴';
    rec.onresult=e=>{
      const txt=(e.results[0]?.[0]?.transcript||'').trim();
      const inp=$('#f-exname');
      if(inp&&txt){inp.value=txt.charAt(0).toUpperCase()+txt.slice(1);inp.focus();}
    };
    rec.onerror=()=>toast('No se pudo escuchar. Probá de nuevo.');
    rec.onend=()=>{VOICE=null;b.classList.remove('accent');b.textContent='🎤';};
    rec.start();
  },
  'ex-edit':b=>{const d=S.routine[+b.dataset.wd];sheetExForm(+b.dataset.wd,d.exercises.find(e=>e.id===b.dataset.ex));},
  'ex-save':b=>saveExercise(+b.dataset.wd,b.dataset.ex||null),
  'ex-del':async b=>{
    const wd=+b.dataset.wd,d=S.routine[wd];
    const ex=d.exercises.find(e=>e.id===b.dataset.ex);
    if(!ex)return;
    pushHistory(`"${ex.name}" eliminado`);
    d.exercises=d.exercises.filter(e=>e.id!==b.dataset.ex);
    await persistDay(wd);renderRutina();
  },
  'ex-up':async b=>{await moveEx(+b.dataset.wd,b.dataset.ex,-1);},
  'ex-down':async b=>{await moveEx(+b.dataset.wd,b.dataset.ex,1);},
  /* rutina: resumen ↔ editor ↔ biblioteca */
  'rut-edit':()=>{S.rutMode='edit';renderRutina();scrollTo({top:0,behavior:'instant'});},
  'rut-view':()=>{S.rutMode='view';RUT_HISTORY=[];RUT_REDO=[];renderRutina();scrollTo({top:0,behavior:'instant'});},
  'rut-undo':()=>undoRutina(),
  'rut-redo':()=>redoRutina(),
  'rut-edit-day':b=>{S.rutMode='edit';S.rutOpen=+b.dataset.wd;closeSheet();renderRutina();scrollTo({top:0,behavior:'instant'});},
  'day-peek':b=>sheetDayPeek(+b.dataset.wd),
  'lib-open':()=>sheetLibrary(),
  'lib-save':()=>sheetLibSave(),
  'lib-save-confirm':async()=>{
    const name=($('#f-savename')?.value||'').trim();
    if(!name){toast('Ingresá un nombre');return;}
    const days=routineSnapshot();
    const prev=S.lib.find(r=>norm(r.name)===norm(name));
    const doSave=async()=>{
      if(prev){prev.days=days;prev.savedAt=dstr();}
      else S.lib.unshift({id:uid(),name,days,savedAt:dstr()});
      S.cfg.routineName=name;
      await saveLib();await saveCfg();
      RUT_HISTORY=[];RUT_REDO=[];
      closeSheet();renderRutina();vibrate(15);
      toast(`Guardada como "${name}"`);
    };
    if(prev)sheetConfirm(`¿Reemplazar "${prev.name}"?`,'Ya tenés una rutina guardada con este nombre.','Reemplazar',doSave,()=>sheetLibSave(name));
    else await doSave();
  },
  'lib-apply':async b=>{
    const r=S.lib.find(x=>x.id===b.dataset.id);if(!r)return;
    sheetConfirm(`¿Reemplazar tu split?`,`Esto reemplaza tu split actual por "${r.name}". Tu historial de sesiones no se toca.`,'Reemplazar',async()=>{
      await applyDays(r.days,r.name);
      S.rutMode='view';S.rutOpen=routineStats().days[0]??new Date().getDay();
      closeSheet();renderRutina();vibrate([20,40,20]);
      toast(`"${r.name}" en uso`);
    },()=>sheetLibrary());
  },
  'lib-del':b=>{
    const r=S.lib.find(x=>x.id===b.dataset.id);if(!r)return;
    sheetConfirm(`¿Borrar "${r.name}"?`,'Tu split actual no cambia — solo se borra de tu biblioteca.','Borrar',async()=>{
      S.lib=S.lib.filter(x=>x.id!==r.id);
      await saveLib();sheetLibrary();
    },()=>sheetLibrary());
  },
  /* nutrición */
  'nutri-prev':()=>shiftNutriDate(-1),
  'nutri-next':()=>shiftNutriDate(1),
  'nutri-today':()=>{S.nutriDate=dstr();renderNutri();},
  'meal-add':()=>sheetMealForm(),
  'meal-save':()=>saveMeal(),
  'profile-open':()=>sheetProfile(),
  'prof-sex':b=>{S.cfg.profile.sex=b.dataset.v;$$('#sheet [data-act="prof-sex"]').forEach(x=>x.classList.toggle('on',x.dataset.v===b.dataset.v));refreshProfilePreview();},
  'prof-usebw':b=>{const inp=$('#f-pweight');if(inp){inp.value=b.dataset.v;refreshProfilePreview();}},
  'prof-save':()=>saveProfile(),
  'goalmode':async b=>{
    S.cfg.goalsAuto=b.dataset.v==='auto';
    if(S.cfg.goalsAuto&&!computeMacros()){S.cfg.goalsAuto=false;closeSheet();sheetProfile();return;}
    applyComputedGoals();await saveCfg();sheetSettings();render(true);
  },
  'meal-del':async b=>{
    await idb.del('meals',b.dataset.id);
    S.meals=S.meals.filter(m=>m.id!==b.dataset.id);
    render(true);
  },
  'food-add':b=>addMealFromFood(b.dataset.id),
  'food-editmode':()=>{S.foodEdit=!S.foodEdit;render(true);},
  'food-del':async b=>{
    await idb.del('foods',b.dataset.id);
    S.foods=S.foods.filter(f=>f.id!==b.dataset.id);
    if(!S.foods.length)S.foodEdit=false;
    render(true);
  },
  /* hoy: pre-workout */
  /* --- confirmación del registro por voz --- */
  'vlog-step':b=>{
    const i=+b.dataset.i,f=b.dataset.f,d=+b.dataset.d,it=VLOG?.items[i];if(!it)return;
    if(f==='w')it.w=Math.max(0,round1(it.w+d*wStep()));
    else it[f]=Math.max(1,it[f]+d);
    const inp=$(`input[data-chg="vlog"][data-i="${i}"][data-f="${f}"]`);
    if(inp)inp.value=it[f];
  },
  'vlog-del':b=>{
    const i=+b.dataset.i;if(!VLOG)return;
    VLOG.items.splice(i,1);
    if(!VLOG.items.length){closeSheet();VLOG=null;toast('Registro descartado');return;}
    sheetVoiceLog();
  },
  'vlog-dur':b=>{
    if(!VLOG)return;
    VLOG.duration=Math.max(1,VLOG.duration+ +b.dataset.d);
    const inp=$('input[data-chg="vlog-dur"]');if(inp)inp.value=VLOG.duration;
  },
  'vlog-save':async()=>{
    if(!VLOG?.items.length)return;
    const wd=new Date().getDay(),day=S.routine[wd];
    const entries=VLOG.items.map(it=>({
      exId:uid(),name:it.name,
      sets:Array.from({length:it.sets},()=>({w:round1(it.w),r:it.reps}))
    }));
    const end=Date.now(),dur=Math.max(1,VLOG.duration|0);
    const sess={id:uid(),date:dstr(),weekday:wd,dayName:day?.name||WD[wd],
      start:end-dur*60000,end,duration:dur,entries};
    await idb.put('sessions',sess);
    S.sessions.unshift(sess);
    const n=entries.reduce((a,e)=>a+e.sets.length,0);
    VLOG=null;closeSheet();vibrate([30,50,30]);render(true);
    toast(`💪 Sesión guardada · ${n} series · ${dur} min`);
  },
  'prewk-open':()=>sheetPreworkout(),
  'hoy-voice':b=>{
    if(!SR_CLASS)return;
    if(VOICE){VOICE.stop();return;} // toca de nuevo para cancelar
    const rec=new SR_CLASS();
    rec.lang='es-ES';rec.interimResults=false;rec.maxAlternatives=1;
    VOICE=rec;b.classList.add('accent');
    const icon=b.querySelector('.pwi')||b;icon.textContent='🔴';
    const label=b.querySelector('.pwt');if(label)label.textContent='Escuchando…';
    rec.onresult=e=>{
      const txt=(e.results[0]?.[0]?.transcript||'').trim();
      if(!txt)return;
      const items=parseWorkoutSpeech(txt);
      if(!items.length){
        toast(`No reconocí ningún ejercicio en "${txt}". Nombralos como están en tu rutina.`);
        return;
      }
      VLOG={items,duration:60,raw:txt};
      sheetVoiceLog();
    };
    rec.onerror=()=>toast('No se pudo escuchar. Probá de nuevo.');
    rec.onend=()=>{
      VOICE=null;b.classList.remove('accent');
      const i=b.querySelector('.pwi')||b;i.textContent='🎤';
      const l=b.querySelector('.pwt');if(l)l.textContent='Registrar por voz';
    };
    rec.start();
  },
  'pw-add-macros':async b=>{
    const c=Math.max(0,parseInt(b.dataset.c)||0);
    if(!c){toast('No hay carbos que sumar');return;}
    /* se registra en el día de hoy, no en la fecha que estés mirando en Nutrición:
       el pre-workout se toma ahora */
    const meal={id:uid(),date:dstr(),name:'Pre-workout',kcal:Math.round(c*4),p:0,c,f:0,t:new Date().toTimeString().slice(0,5)};
    await idb.put('meals',meal);S.meals.push(meal);
    vibrate(12);closeSheet();
    if(S.tab==='nutri')renderNutri();
    toast(`＋ Sumado a Nutrición · ${Math.round(c*4)} kcal · ${c} g carbos`);
  },
  'pw-meal':()=>{PW.meal=!PW.meal;sheetPreworkout();},
  'pw-sens':()=>{PW.sensitive=!PW.sensitive;sheetPreworkout();},
  /* progreso */
  'body-open':()=>sheetBodyForm(),
  'body-save':()=>saveBody(),
  'guide-open':()=>sheetGuide(),
  /* ajustes */
  'unit':b=>{S.cfg.unit=b.dataset.u;saveCfg();$$('#sheet [data-act="unit"]').forEach(x=>x.classList.toggle('on',x.dataset.u===S.cfg.unit));render(true);},
  'export':()=>exportJSON(),
  'import-pick':()=>$('#importFile').click(),
  'wipe':()=>wipeAll(),
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const fn=ACT[b.dataset.act];
  if(fn)fn(b,e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  const chg=t.dataset.chg;
  if(!chg)return;
  if(chg==='w'){
    const v=S.hoyVals[t.dataset.ex];
    const num=parseFloat(t.value);
    if(!isNaN(num)&&num>=0)v.w=S.cfg.unit==='kg'?num:lb2kg(num);
    updExDisplays(t.dataset.ex);
  }else if(chg==='r'){
    const v=S.hoyVals[t.dataset.ex];
    const num=parseInt(t.value);
    if(!isNaN(num)&&num>0)v.r=num;
    updExDisplays(t.dataset.ex);
  }else if(chg==='goal'){
    const num=Math.max(0,parseInt(t.value)||0);
    S.cfg.goals[t.dataset.k]=num;saveCfg();
  }else if(chg==='prog-ex'){
    S.progEx=t.value;renderProg();
  }else if(chg==='vlog'){
    const it=VLOG?.items[+t.dataset.i];if(!it)return;
    const num=parseFloat(t.value);
    if(!isNaN(num)&&num>=0)it[t.dataset.f]=t.dataset.f==='w'?round1(num):Math.max(1,Math.round(num));
  }else if(chg==='vlog-dur'){
    const num=parseInt(t.value);
    if(!isNaN(num)&&num>0&&VLOG)VLOG.duration=num;
  }
});
/* preview en vivo del perfil: sliders, campos numéricos y selects */
const PROF_IDS=new Set(['f-page','f-pheight','f-pweight','f-ptdee','f-ppref','f-fpref','f-pactivity','f-pgoal']);
document.addEventListener('input',e=>{
  if(PROF_IDS.has(e.target.id)&&$('#f-pweight'))refreshProfilePreview();
  if(e.target.id==='f-exname')updateExAutocomplete(e.target.value);
});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(f)importJSON(f);
  e.target.value='';
});
async function moveEx(wd,exId,dir){
  const d=S.routine[wd];
  const i=d.exercises.findIndex(e=>e.id===exId);
  const j=i+dir;
  if(i<0||j<0||j>=d.exercises.length)return;
  pushHistory('Ejercicios reordenados');
  [d.exercises[i],d.exercises[j]]=[d.exercises[j],d.exercises[i]];
  await persistDay(wd);
  flipSort(()=>renderRutina());
}

/* ================= boot ================= */
(async function(){
  await idbOpen();
  await loadAll();
  /* ?seed abre la app ya poblada, sin pasar por Ajustes: es para mirar la app
     llena en otro dispositivo. Si ya está cargado no duplica, y saco el
     parámetro de la URL para que un refresh no vuelva a dispararlo. */
  if(/[?&]seed(=|&|$)/.test(location.search)){
    if(!seedCount())await seedRegistro().then(loadAll);
    history.replaceState(null,'',location.pathname);
  }
  switchTab('hoy');
  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
